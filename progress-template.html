<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delegation Board</title>
<style>
:root{--paper:#FAFAF8;--ink:#1A1D21;--muted:#5C6470;--line:#E3E1DB;--card:#FFF;
  --done:#2E7D4F;--done-bg:#E8F2EC;--run:#A8721C;--run-bg:#F7EEDD;--pend:#8A8F98;--pend-bg:#EFEFED;
  --fail:#B0453A;--fail-bg:#F6E7E5;--block:#7A5EA8;--block-bg:#EEE8F6;--accent:#3B6FA0}
@media (prefers-color-scheme: dark){:root{--paper:#141619;--ink:#E6E4DF;--muted:#9AA1AB;--line:#2A2E34;--card:#1C1F24;
  --done:#5FBF8A;--done-bg:#1D2E25;--run:#D9A84E;--run-bg:#322A1B;--pend:#7C828C;--pend-bg:#22262C;
  --fail:#D97A6E;--fail-bg:#33211F;--block:#A98EDB;--block-bg:#262031;--accent:#6FA3D4}}
body{margin:0;padding:32px 16px;background:var(--paper);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:20px;margin:0}
.meta{color:var(--muted);font-size:12.5px;margin:4px 0 24px;font-family:ui-monospace,Menlo,monospace}
.proj{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:24px 0 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
.ihead{display:flex;align-items:center;gap:10px;padding:12px 16px}
.ititle{font-weight:600;flex:1}
.kind{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.pill{font-size:11px;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.s-done{color:var(--done);background:var(--done-bg)}.s-in_progress{color:var(--run);background:var(--run-bg)}
.s-pending{color:var(--pend);background:var(--pend-bg)}.s-failed{color:var(--fail);background:var(--fail-bg)}
.s-blocked{color:var(--block);background:var(--block-bg)}
.bar{height:4px;background:var(--pend-bg)}.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.task{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--pend);border-radius:8px;padding:11px 13px;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.task:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.10);border-color:var(--muted)}
.task.t-done{border-left-color:var(--done)}.task.t-in_progress{border-left-color:var(--run)}
.task.t-failed{border-left-color:var(--fail)}.task.t-blocked{border-left-color:var(--block)}
.thead{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.tid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpct{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:700;color:var(--muted)}
.ttl{font-weight:600;font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0}
.tag{font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--pend-bg);color:var(--muted);white-space:nowrap}
.tag.who{color:var(--accent)}
.tag.mono{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.note{color:var(--muted);font-size:11.5px;margin-top:6px;line-height:1.45;overflow-wrap:anywhere}
.who{font-size:11px;font-weight:600;color:var(--accent)}
.stats{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.stats-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:0 0 10px}
.stats-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats-count{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--ink)}
.stats-bar{height:6px;background:var(--pend-bg);border-radius:99px;overflow:hidden;margin:0 0 14px}
.stats-bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips + .chips{margin-top:8px}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip b{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.chip-who{color:var(--accent);background:var(--pend-bg)}
.chip-meta{color:var(--muted);background:var(--pend-bg)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.filter{font:600 11.5px/1 inherit;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.filter:hover{color:var(--ink);border-color:var(--muted)}
.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.board-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.refresh{font:600 11.5px/1 inherit;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none;transition:background .15s,color .15s,border-color .15s}
.refresh:hover{color:var(--ink);border-color:var(--muted)}
.refresh .glyph{font-size:13px;line-height:1}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div id="serve-note" style="max-width:720px;margin:40px auto;padding:24px;border:1px solid #444;border-radius:12px;font-family:ui-monospace,monospace;line-height:1.7;color:#ddd;background:#1c1c22">
<strong style="font-size:16px">&#9888;&#65039; This board was opened as a file &mdash; it must be viewed through its local server.</strong><br><br>
1. Start the server (once):<br>
<code style="background:#111;padding:2px 6px;border-radius:4px">cd &lt;repo&gt;/progress &amp;&amp; python3 -m http.server 8123</code><br><br>
2. Then open: <a href="http://localhost:8123/" style="color:#7aa2ff;font-weight:600">http://localhost:8123/</a> and click the board file.<br><br>
<span style="color:#888">(When the board is served correctly, this notice never appears.)</span>
</div></div>

<script id="progress-data" type="application/json">
{"product":"","date":"","updatedAt":"","projects":[],"items":[]}
</script>

<script>
document.getElementById('serve-note')?.remove();
const D = JSON.parse(document.getElementById('progress-data').textContent);
// file:// self-heal: the board must be viewed over its local server (some
// embedded browser panes render file:// as a blank page). If the server is up
// we hop to it; if not, the banner below still beats a silent blank.
if (location.protocol === 'file:') {
  const port = D.boardPort || 8123;
  const served = 'http://localhost:' + port + '/' + location.pathname.split('/').pop();
  document.getElementById('app').innerHTML =
    '<div style="padding:24px;font:14px/1.6 ui-monospace,monospace">' +
    '<strong>This board must be opened via its local server.</strong><br>' +
    'Trying <a href="' + served + '">' + served + '</a>…<br><br>' +
    'If nothing happens, start it with:<br>' +
    '<code>cd &lt;repo&gt;/progress &amp;&amp; python3 -m http.server ' + port + '</code></div>';
  fetch(served, { method: 'HEAD' }).then(() => location.replace(served)).catch(() => {});
}
const pill = s => `<span class="pill s-${s}">${s.replace('_',' ')}</span>`;

// progress is DERIVED, never hand-authored: criteria met if reported, else the status floor.
const PCT = {pending:0, blocked:0, failed:0, in_progress:50, done:100};
const prog = t => {
  const n = (t.acceptanceCriteria||[]).length, m = t.criteriaMet||0;
  return (t.status==='in_progress' && n && m) ? Math.round(m/n*100) : (PCT[t.status]??0);
};
const itemProg = it => (it.tasks||[]).length
  ? Math.floor(it.tasks.reduce((s,t)=>s+prog(t),0)/it.tasks.length)
  : (PCT[it.status]??0);
const mins = t => (t.startedAt && t.endedAt)
  ? Math.max(1, Math.round((new Date(t.endedAt)-new Date(t.startedAt))/60000)) : null;
const fmtK = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : String(n);
const dash = v => v==null||v==='' ? '·' : v;
const when = t => t.startedAt ? new Date(t.startedAt).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

const tag = (v, cls='') => v ? `<span class="tag ${cls}">${v}</span>` : '';
const taskCard = x => `<div class="task t-${x.status}" data-status="${x.status}">
  <div class="thead"><span class="tid">${x.id}</span>${pill(x.status)}<span class="tpct">${prog(x)}%</span></div>
  <div class="ttl">${x.title}</div>
  <div class="tags">${tag(x.type)}${tag(x.assignee,'who')}${tag(when(x),'mono')}
    ${tag(mins(x) && mins(x)+'m','mono')}${tag(x.tokens && fmtK(x.tokens)+' tok','mono')}
    ${tag((x.added||x.removed) && `+${x.added||0}/-${x.removed||0}`,'mono')}</div>
  ${x.note?`<div class="note">${x.note}</div>`:''}
</div>`;
const itemCard = it => { const p = itemProg(it); return `<div class="item">
  <div class="ihead"><span class="ititle">${it.title}</span><span class="kind">${it.kind}</span>${pill(it.status)}<span class="mono">${p}%</span></div>
  <div class="bar"><i style="width:${p}%"></i></div>
  ${it.tasks?.length?`<div class="tasks">${it.tasks.map(taskCard).join('')}</div>`:''}
</div>`; };

// --- stats + filter (computed client-side from the same data island) ---
const STATUSES = ['done','in_progress','pending','blocked','failed'];
const LABELS = {done:'done',in_progress:'in progress',pending:'pending',blocked:'blocked',failed:'failed'};
const allTasks = (D.items||[]).flatMap(i=>i.tasks||[]);
const total = allTasks.length;
const byStatus = Object.fromEntries(STATUSES.map(s=>[s,0]));
const byAssignee = {fable:0,opus:0,kimi:0,codex:0};
for(const t of allTasks){
  if(t.status in byStatus) byStatus[t.status]++;
  if(t.assignee in byAssignee) byAssignee[t.assignee]++;
}
const doneCount = byStatus.done;
const pct = total ? Math.round(allTasks.reduce((s,t)=>s+prog(t),0)/total) : 0;
const sum = k => allTasks.reduce((s,t)=>s+(t[k]||0),0);
const totMin = allTasks.reduce((s,t)=>s+(mins(t)||0),0);
const metaChips = `<span class="chip chip-meta">${totMin>=60?(totMin/60).toFixed(1)+'h':totMin+'m'} spent</span>`
  + `<span class="chip chip-meta">${fmtK(sum('tokens'))} tokens</span>`
  + `<span class="chip chip-meta">+${sum('added')}/-${sum('removed')} lines</span>`;
const storyCount = (D.items||[]).filter(i=>i.kind==='story').length;
const projCount = (D.projects||[]).length;
const statusChips = STATUSES.map(s=>`<span class="chip s-${s}">${LABELS[s]} <b>${byStatus[s]}</b></span>`).join('');
const assigneeChips = Object.keys(byAssignee).map(a=>`<span class="chip chip-who">${a} <b>${byAssignee[a]}</b></span>`).join('');
const statsPanel = `<div class="stats">
  <div class="stats-top"><span class="stats-label">Overall completion</span><span class="stats-count">${doneCount}/${total} tasks done (${pct}%)</span></div>
  <div class="stats-bar"><i style="width:${pct}%"></i></div>
  <div class="chips">${statusChips}</div>
  <div class="chips">${assigneeChips}<span class="chip chip-meta">${storyCount} ${storyCount===1?'story':'stories'}</span><span class="chip chip-meta">${projCount} ${projCount===1?'project':'projects'}</span></div>
  <div class="chips">${metaChips}</div>
</div>`;
const FILTERS = [['all','All'],['done','Done'],['in_progress','In progress'],['pending','Pending'],['blocked','Blocked'],['failed','Failed']];
const filterBar = `<div class="filters" id="filters">${FILTERS.map(([v,l],i)=>`<button type="button" class="filter${i===0?' active':''}" data-filter="${v}">${l}</button>`).join('')}</div>`;

const grouped = new Set((D.projects||[]).flatMap(p=>p.storyIds||[]));
let html = `<div class="board-head"><div><h1>${D.product} — delegation board</h1><div class="meta">${D.date} · updated ${D.updatedAt}</div></div><button type="button" id="refresh" class="refresh" aria-label="Refresh board"><span class="glyph" aria-hidden="true">↻</span>Refresh</button></div>`;
html += statsPanel + filterBar;
for(const p of D.projects||[]){
  html += `<div class="proj">${p.title}</div>` + (p.storyIds||[]).map(id=>{
    const it=(D.items||[]).find(i=>i.id===id); return it?itemCard(it):'';}).join('');
}
html += (D.items||[]).filter(i=>!grouped.has(i.id)).map(itemCard).join('');
const app = document.getElementById('app');
app.innerHTML = html;

function applyFilter(f){
  app.querySelectorAll('.task[data-status]').forEach(tr=>{
    tr.classList.toggle('hide', f!=='all' && tr.dataset.status!==f);
  });
  app.querySelectorAll('.item').forEach(item=>{
    const rows = item.querySelectorAll('.task[data-status]');
    const anyVisible = [...rows].some(r=>!r.classList.contains('hide'));
    item.classList.toggle('hide', f!=='all' && (rows.length===0 || !anyVisible));
  });
  app.querySelectorAll('.proj').forEach(proj=>{
    let el = proj.nextElementSibling, vis = false;
    while(el && !el.classList.contains('proj')){
      if(el.classList.contains('item') && !el.classList.contains('hide')){ vis = true; break; }
      el = el.nextElementSibling;
    }
    proj.classList.toggle('hide', !vis);
  });
  app.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active', b.dataset.filter===f));
}
const FILTER_KEY = 'board-filter';
const validFilters = new Set(FILTERS.map(([v])=>v));
function loadFilter(){
  try{ const v = localStorage.getItem(FILTER_KEY); return validFilters.has(v) ? v : 'all'; }
  catch(e){ return 'all'; }
}
function saveFilter(f){
  try{ localStorage.setItem(FILTER_KEY, f); }catch(e){}
}
app.querySelector('#filters').addEventListener('click', e=>{
  const b = e.target.closest('.filter');
  if(b){ saveFilter(b.dataset.filter); applyFilter(b.dataset.filter); }
});
app.querySelector('#refresh').addEventListener('click', ()=>window.location.reload());
applyFilter(loadFilter());
</script>
</body>
</html>
